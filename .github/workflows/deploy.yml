name: Deploy SwiftSite to Azure

on:
  push:
    branches: [ main ]

concurrency:
  group: azure-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, fileinfo, openssl, gd, zip

    - name: Install Composer packages
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build frontend assets
      run: |
        npm ci
        npm run build

    - name: Create production .env
      run: |
        echo "APP_NAME=SwiftSite" > .env
        echo "APP_ENV=production" >> .env
        echo "APP_KEY=base64:placeholder" >> .env
        echo "APP_DEBUG=false" >> .env
        echo "DB_CONNECTION=mysql" >> .env

    - name: Clean up dev files
      run: rm -rf node_modules tests

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: '${{ secrets.AZURE_CREDENTIALS }}'

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'swiftsite'
        package: .

    - name: Logout
      if: always()
      run: az logout